# Build the XL1 multi-role Docker image for a specific xl1-cli version
# and push it to GHCR, tagged with that version.
#
# Run manually from the Actions tab ("Run workflow") or:
#   gh workflow run build-image.yml -f version=5.0.3
#
# Also callable from other workflows (see build-latest.yml, which is the
# only place the :latest tag comes from).
#
# Version tags are immutable. npm forbids republishing a version, so
# `<version>` fully determines image contents and there is never a reason to
# build one twice: if `<image>:<version>` is already in GHCR the build is
# skipped. Pass `force` to rebuild anyway (e.g. to pick up base-image
# security patches under an existing tag).

name: build-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'xl1-cli version to bake in (XL1_CLI_VERSION build arg)'
        required: true
        type: string
      force:
        description: 'Rebuild and overwrite even if this version tag is already published'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag-latest:
        description: 'Also move the :latest tag to this build'
        required: false
        type: boolean
        default: false
      force:
        description: 'Rebuild and overwrite even if this version tag is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xyoraclenetwork/xl1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and compute tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          TAG_LATEST: ${{ inputs.tag-latest }}
        run: |
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a valid semver version" >&2
            exit 1
          fi
          RESOLVED="$(npm view "@xyo-network/xl1-cli@${VERSION}" version 2>/dev/null || true)"
          if [[ "${RESOLVED}" != "${VERSION}" ]]; then
            echo "::error::@xyo-network/xl1-cli@${VERSION} not found on npm" >&2
            exit 1
          fi
          TAGS="${IMAGE}:${VERSION}"
          if [[ "${TAG_LATEST}" == "true" ]]; then
            TAGS+=$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Idempotency gate. Must run after login: GHCR returns the same denial
      # for "no such package" and "not authorized", so an unauthenticated
      # probe cannot tell absent from forbidden.
      - name: Check whether this version is already published
        id: published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE}:${VERSION} is already published"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE}:${VERSION} is not published yet"
          fi

      # The version is already built, but :latest does not point at it — the
      # case where a manual build of N is later picked up by build-latest.
      # Repoint the tag at the existing digest; no rebuild, nothing pulled.
      - name: Move :latest onto the published version
        if: ${{ steps.published.outputs.exists == 'true' && !inputs.force && inputs.tag-latest }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          echo "Moved ${IMAGE}:latest onto the existing ${IMAGE}:${VERSION} digest"

      - uses: pnpm/action-setup@v4
        if: ${{ steps.published.outputs.exists != 'true' || inputs.force }}

      - uses: actions/setup-node@v4
        if: ${{ steps.published.outputs.exists != 'true' || inputs.force }}
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Compile entrypoint
        if: ${{ steps.published.outputs.exists != 'true' || inputs.force }}
        run: |
          pnpm install --frozen-lockfile
          pnpm xy compile

      - uses: docker/build-push-action@v6
        if: ${{ steps.published.outputs.exists != 'true' || inputs.force }}
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            XL1_CLI_VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: ${{ success() }}
        env:
          VERSION: ${{ inputs.version }}
          EXISTS: ${{ steps.published.outputs.exists }}
          FORCED: ${{ inputs.force }}
          TAG_LATEST: ${{ inputs.tag-latest }}
        run: |
          if [[ "${EXISTS}" == "true" && "${FORCED}" != "true" ]]; then
            if [[ "${TAG_LATEST}" == "true" ]]; then
              echo "Skipped build of ${VERSION} (already published); moved :latest onto it." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "Skipped build of ${VERSION} (already published). Re-run with force to rebuild." >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "Built and pushed:" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            echo "${IMAGE}:${VERSION}" >> "${GITHUB_STEP_SUMMARY}"
            [[ "${TAG_LATEST}" == "true" ]] && echo "${IMAGE}:latest" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
